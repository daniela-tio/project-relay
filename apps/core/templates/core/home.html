<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home · Project Relay</title>
  </head>
  <body>
    {% for message in messages %}
    <p>{{ message }}</p>
    {% endfor %}
    <p>
      Signed in as {{ user.get_full_name|default:user.username }} ({{ user.get_role_display }}).
    </p>
    <form method="post" action="{% url 'sign_out' %}">
      {% csrf_token %}
      <button type="submit">Sign out</button>
    </form>
  </body>
</html>
