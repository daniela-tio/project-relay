{% extends "layouts/app.html" %}

{% block title %}Set password{% endblock %}
{% block page_title %}Set password for {{ target_user.username }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}{% include "partials/_form_field.html" %}{% endfor %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Set Password</button>
                <a href="{% url 'user_list' %}" class="btn btn-link">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
