<td>
  {% if row.school.status == "open" %}<span class="badge bg-green-lt">Open</span>
  {% elif row.school.status == "closed" %}<span class="badge bg-secondary-lt">Closed</span>
  {% elif row.school.status == "proposed_close" %}<span class="badge bg-yellow-lt">Proposed to close</span>
  {% else %}<span class="badge bg-blue-lt">{{ row.school.get_status_display }}</span>{% endif %}
</td>
