<div class="modal modal-blur fade" id="{{ modal_id }}" tabindex="-1" aria-labelledby="{{ modal_id }}-title" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <h3 class="modal-title" id="{{ modal_id }}-title">{{ title }}</h3>
        <p class="text-secondary mb-0">{{ message }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-link link-secondary me-auto" data-bs-dismiss="modal">Go back</button>
        <form method="post" action="{{ action_url }}">
          {% csrf_token %}
          <button type="submit" class="btn {% if danger %}btn-danger{% else %}btn-primary{% endif %}">{{ button }}</button>
        </form>
      </div>
    </div>
  </div>
</div>
