<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Project Relay</title>
  </head>
  <body>
    {% for message in messages %}
    <p>{{ message }}</p>
    {% endfor %}
    <h1>Sign in</h1>
    <form method="post">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
